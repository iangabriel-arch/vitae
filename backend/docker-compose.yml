services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: vitae
      POSTGRES_PASSWORD: vitae_dev
      POSTGRES_DB: vitae_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vitae -d vitae_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
